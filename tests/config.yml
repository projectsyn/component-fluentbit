parameters:
  fluentbit:
    secret:
      AWS_ACCESS_KEY_ID: <SUPER_SECRET>
      AWS_SECRET_ACCESS_KEY: <EVEN_MORE_SUPERER>

    namespaceLabels:
      vshn_net_solution_monitoring: solution-base-monitoring

    networkPolicy:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  name: openshift-logging

    helm_values:
      envFrom:
        - secretRef:
            name: ${fluentbit:secretName}
